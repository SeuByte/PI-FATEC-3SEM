version: "3.8"

services:
  web:
    build: .
    container_name: django_app

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - mongodb

  mongodb:
    image: mongo:7

    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: