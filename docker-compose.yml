services:
  web:
    build: .
    container_name: django_app
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGO_HOST=mongodb
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - ./mongodb_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      # Adicione estas linhas para dar privilégios totais ao container:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "" 
      ME_CONFIG_MONGODB_ADMINPASSWORD: ""
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true" # ISSO É O MAIS IMPORTANTE
    depends_on:
      mongodb:
        condition: service_started